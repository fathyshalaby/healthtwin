name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages + app
        run: pnpm -w build

      - name: Unit tests
        run: pnpm -w test

      - name: Install Playwright browser
        run: pnpm --filter @healthtwin/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter @healthtwin/web e2e

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
      - run: python3 packages/mobile/generate.py
      - run: flutter pub get
        working-directory: packages/flutter
      - run: flutter test
        working-directory: packages/flutter

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: python3 packages/mobile/generate.py
      - run: gradle test
        working-directory: packages/android

  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - run: python3 packages/mobile/generate.py
      - run: swift test
        working-directory: packages/swift
